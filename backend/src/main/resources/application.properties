spring.application.name=moviq-backend
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1000MB

# Centralized Branding Configuration
app.brand.name=Moviq
app.brand.subtitle=Moviq Audio Track
app.brand.video-export-filename=moviq_video.mp4
app.brand.audio-export-filename=moviq_audio.mp3

# System Executables (Allows overriding in Docker / OCI containers via ENV vars)
cozicut.ffmpeg.executable=${COZICUT_FFMPEG_EXECUTABLE:/opt/homebrew/bin/ffmpeg}
cozicut.ffprobe.executable=${COZICUT_FFPROBE_EXECUTABLE:/opt/homebrew/bin/ffprobe}
cozicut.ytdlp.executable=${COZICUT_YTDLP_EXECUTABLE:/opt/homebrew/bin/yt-dlp}
cozicut.node.executable=${COZICUT_NODE_EXECUTABLE:/opt/homebrew/bin/node}
cozicut.ffmpeg.timeout-seconds=${COZICUT_FFMPEG_TIMEOUT:120}
cozicut.ytdlp.timeout-seconds=${COZICUT_YTDLP_TIMEOUT:180}
