services:
  moviq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moviq-app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=500MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=1000MB
      - COZICUT_FFMPEG_TIMEOUT=180
      - COZICUT_YTDLP_TIMEOUT=240
    tmpfs:
      - /tmp:exec,mode=777,size=4G
